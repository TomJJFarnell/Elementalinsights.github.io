name: Weekly Cafe Report Email

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9 AM UTC
  workflow_dispatch:  # Manual trigger

jobs:
  send-weekly-report:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy python-dotenv
    
    - name: Send weekly report
      env:
        ZOHO_EMAIL: ${{ secrets.ZOHO_EMAIL }}
        ZOHO_PASSWORD: ${{ secrets.ZOHO_PASSWORD }}
        ZOHO_SMTP_SERVER: 'smtp.zoho.eu'  # ← Changed to EU server
        ZOHO_SMTP_PORT: '587'
        SENDER_NAME: 'Foresight IQ Analytics'
      run: |
        cd email-reports
        python -c "
        import os
        from weekly_email_report import WeeklyReportGenerator
        
        # Configure email settings for EU server
        email_config = {
            'smtp_server': 'smtp.zoho.eu',
            'smtp_port': 587,
            'email': os.getenv('ZOHO_EMAIL'),
            'password': os.getenv('ZOHO_PASSWORD'),
            'sender_name': os.getenv('SENDER_NAME')
        }
        
        # Recipients - update these with real email addresses
        recipients = [
            'tom@elementalinsights.co.uk',  # Your email
            # 'manager@yourcafe.com',        # Add client emails here
            # 'owner@yourcafe.com'
        ]
        
        try:
            generator = WeeklyReportGenerator(email_config)
            success = generator.generate_and_send_weekly_report(recipients, test_mode=False)
            
            if success:
                print(f'✅ Weekly report sent successfully to {len(recipients)} recipients!')
            else:
                print('❌ Failed to send weekly report')
                
        except Exception as e:
            print(f'❌ Error: {e}')
            import traceback
            traceback.print_exc()
        "
