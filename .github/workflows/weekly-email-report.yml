name: Weekly Cafe Report Email

# Run every Monday at 9 AM UTC
on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9 AM UTC
  workflow_dispatch:  # Allows manual triggering

jobs:
  send-weekly-report:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install schedule pandas numpy python-dotenv
    
    - name: Send weekly report
      env:
        ZOHO_EMAIL: ${{ secrets.ZOHO_EMAIL }}
        ZOHO_PASSWORD: ${{ secrets.ZOHO_PASSWORD }}
        ZOHO_SMTP_SERVER: 'smtp.zoho.com'
        ZOHO_SMTP_PORT: '587'
        SENDER_NAME: 'Foresight IQ Analytics'
      run: |
        cd email-reports
        python -c "
        import os
        from weekly_email_report import WeeklyReportGenerator
        
        # Get recipients from secrets
        recipients = '${{ secrets.RECIPIENT_EMAILS }}'.split(',')
        recipients = [email.strip() for email in recipients]
        
        # Generate and send report
        generator = WeeklyReportGenerator()
        generator.generate_and_send_weekly_report(recipients)
        "
