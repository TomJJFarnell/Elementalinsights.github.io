name: Simple Email Test

on:
  workflow_dispatch:

jobs:
  test-email:
    runs-on: ubuntu-latest
    
    steps:
    - name: Test email sending
      env:
        ZOHO_EMAIL: ${{ secrets.ZOHO_EMAIL }}
        ZOHO_PASSWORD: ${{ secrets.ZOHO_PASSWORD }}
      run: |
        python -c "
        import smtplib
        from email.mime.text import MIMEText
        import os
        
        # Simple email test
        msg = MIMEText('Test email from GitHub Actions')
        msg['Subject'] = 'Test Email'
        msg['From'] = os.getenv('ZOHO_EMAIL')
        msg['To'] = 'tomfarnell@me.com'  # Replace with your email
        
        try:
            with smtplib.SMTP('smtp.zoho.com', 587) as server:
                server.starttls()
                server.login(os.getenv('ZOHO_EMAIL'), os.getenv('ZOHO_PASSWORD'))
                server.send_message(msg)
                print('✅ Email sent successfully!')
        except Exception as e:
            print('❌ Error:', str(e))
        "
