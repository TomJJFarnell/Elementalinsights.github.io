  - name: Send weekly report
      env:
        ZOHO_EMAIL: ${{ secrets.ZOHO_EMAIL }}
        ZOHO_PASSWORD: ${{ secrets.ZOHO_PASSWORD }}
        ZOHO_SMTP_SERVER: 'smtp.zoho.com'
        ZOHO_SMTP_PORT: '587'
        SENDER_NAME: 'Foresight IQ Analytics'
      run: |
        cd email-reports
        python -c "
        import os
        print('=== DEBUG INFO ===')
        print('Email:', os.getenv('ZOHO_EMAIL'))
        print('Password length:', len(os.getenv('ZOHO_PASSWORD', '')) if os.getenv('ZOHO_PASSWORD') else 0)
        print('SMTP Server:', os.getenv('ZOHO_SMTP_SERVER'))
        print('SMTP Port:', os.getenv('ZOHO_SMTP_PORT'))
        print('==================')
        
        from weekly_email_report import WeeklyReportGenerator
        
        # Test with a simple recipient
        recipients = ['your-test-email@gmail.com']  # Replace with your email
        
        try:
            generator = WeeklyReportGenerator()
            success = generator.generate_and_send_weekly_report(recipients, test_mode=True)
            print('Success:', success)
        except Exception as e:
            print('Error details:', str(e))
            import traceback
            traceback.print_exc()
        "
