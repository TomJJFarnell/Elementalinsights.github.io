name: Test Primary Email

on:
  workflow_dispatch:

jobs:
  test-email:
    runs-on: ubuntu-latest
    
    steps:
    - name: Test with primary email
      env:
        ZOHO_EMAIL: ${{ secrets.ZOHO_EMAIL }}
        ZOHO_PASSWORD: ${{ secrets.ZOHO_PASSWORD }}
      run: |
        python -c "
        import smtplib
        from email.mime.text import MIMEText
        import os
        
        email = os.getenv('ZOHO_EMAIL')
        password = os.getenv('ZOHO_PASSWORD')
        
        print(f'Testing with primary email: {email}')
        
        try:
            with smtplib.SMTP('smtp.zoho.com', 587) as server:
                server.starttls()
                server.login(email, password)
                
                # Send test email
                msg = MIMEText('Test email from GitHub Actions using primary account')
                msg['Subject'] = 'Test - Primary Account'
                msg['From'] = email
                msg['To'] = email
                
                server.send_message(msg)
                print('✅ Email sent successfully with primary account!')
                
        except Exception as e:
            print(f'❌ Error: {e}')
        "
